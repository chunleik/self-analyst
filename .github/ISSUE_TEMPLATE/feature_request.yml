name: 功能建议
description: 提出新功能或改进现有行为
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        SelfAnalyst 的行为契约由 `openspec/specs/` 下的规格定义。较大的改动通常需要先提出
        OpenSpec 变更提案，因此请在这里先把动机和数据边界说清楚。

        请先阅读[数据边界红线](https://github.com/chunleik/self-analyst/blob/main/CONTRIBUTING.md#数据边界红线)。
        涉及 OCR、截图、麦克风、系统声音采集或持久化正文内容的提议，需要重新设计数据边界，
        不会作为普通功能请求处理。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 与 `openspec/specs/`，确认这不是重复提议
          required: true
        - label: 我已阅读数据边界红线，并在下面说明了本提议对采集与持久化范围的影响
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你在什么场景下遇到了什么困难？请描述问题本身，而不是直接描述方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 期望的行为是什么？如果涉及 UI，可以附上草图或截图。
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 主要影响的模块
      multiple: true
      options:
        - self-analyst-events（事件服务、事件策略、原始事件保留）
        - self-analyst-content（前台窗口、UIA、标题提取）
        - self-analyst-file（文件元数据采集）
        - self-analyst-wiki（聚合、摘要、语义索引）
        - self-analyst-app（启动编排、Agent、桌面 API/UI）
        - self-analyst-axsidecar（UIAutomation 边车）
        - self-analyst-desktop（Tauri 壳）
        - 构建与发布（scripts、CI）
        - 文档与规格
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: data-boundary
    attributes:
      label: 是否触及数据边界
      description: 即是否改变采集范围、持久化字段或外发数据。
      options:
        - 不触及，只改变已有数据的展示或处理方式
        - 触及，需要新增采集或持久化字段
        - 触及，需要新增外发数据（LLM、Embedding、搜索）
        - 不确定
    validations:
      required: true

  - type: textarea
    id: boundary-detail
    attributes:
      label: 数据边界说明
      description: 若上一项选择"触及"或"不确定"，请说明需要新增采集或发送哪些数据、为什么必要，以及如何保持本地优先与最小化。

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 包括"什么都不做"的后果，以及现有配置能否已经满足需求。

  - type: textarea
    id: context
    attributes:
      label: 其他信息
      description: 相关 capability 规格链接、参考实现或先例。
