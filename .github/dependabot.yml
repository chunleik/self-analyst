version: 2

updates:
  # 同一更新项的 patch 升级合并为一个 PR，避免同批自动合并的 PR 互相造成落后于 main。
  # minor 与 major 不分组，保留逐个人工处理。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-patch:
        applies-to: version-updates
        update-types: ["patch"]

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      maven-patch:
        applies-to: version-updates
        update-types: ["patch"]

  - package-ecosystem: npm
    directory: /self-analyst-desktop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-patch:
        applies-to: version-updates
        update-types: ["patch"]

  - package-ecosystem: cargo
    directory: /self-analyst-desktop/src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      desktop-cargo-patch:
        applies-to: version-updates
        update-types: ["patch"]

  - package-ecosystem: cargo
    directory: /self-analyst-axsidecar
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      sidecar-cargo-patch:
        applies-to: version-updates
        update-types: ["patch"]
