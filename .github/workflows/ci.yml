name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-storage:
    name: 数据守卫 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: 验证跨进程锁和只读数据接纳
        run: mvn --batch-mode -pl self-analyst-app -am "-Dtest=RuntimeStorageGuardTest,RuntimeStorageProcessTest,RuntimeStorageCompatibilityTest" "-Dsurefire.failIfNoSpecifiedTests=false" test
  verify:
    name: Windows 全量验证
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 21 与 Maven 缓存
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 配置 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: 配置 Rust stable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            self-analyst-desktop/src-tauri -> target
            self-analyst-axsidecar -> target

      - name: 安装 OpenSpec CLI
        shell: pwsh
        run: npm install --global @fission-ai/openspec@1.11.0

      - name: 校验 OpenSpec
        shell: pwsh
        run: openspec validate --all --strict

      - name: 校验 Rust 格式
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --manifest-path self-analyst-desktop/src-tauri/Cargo.toml -- --check
          cargo fmt --manifest-path self-analyst-axsidecar/Cargo.toml -- --check

      - name: 运行 Java 与桌面 Node 测试
        shell: pwsh
        run: mvn --batch-mode test

      - name: 运行 Rust 测试与 Clippy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --manifest-path self-analyst-desktop/src-tauri/Cargo.toml
          cargo clippy --manifest-path self-analyst-desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path self-analyst-axsidecar/Cargo.toml
          cargo clippy --manifest-path self-analyst-axsidecar/Cargo.toml --all-targets -- -D warnings

      - name: 构建 accessibility sidecar
        shell: pwsh
        run: ./scripts/build-axsidecar.ps1

      - name: 运行非敏感 Windows UIA 冒烟
        shell: pwsh
        run: >-
          mvn --batch-mode -pl self-analyst-content -am
          '-Dselfanalyst.synthetic.uia=true'
          '-Dtest=SyntheticUiaSmokeTest'
          '-Dsurefire.failIfNoSpecifiedTests=false' test

      - name: 构建可执行 JAR
        shell: pwsh
        run: mvn --batch-mode package -DskipTests

      - name: 冒烟验证打包 JAR
        shell: pwsh
        run: ./scripts/check-packaged-jar.ps1

  privacy-ui:
    name: 隐私界面验证 (Linux)
    # 与固定 Playwright 版本匹配，避免 latest 自动升级到尚未支持的发行版。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 安装固定版本浏览器测试依赖
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: 验证生产隐私 UI 与合成数据
        run: python scripts/check-privacy-ui.py --output-dir artifacts/privacy-ui
      - name: 保存中英文与小尺寸截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-ui-screenshots
          path: artifacts/privacy-ui/
          if-no-files-found: warn
          retention-days: 14
