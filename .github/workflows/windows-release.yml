name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: 构建并发布 Windows 分发包
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 配置 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 配置 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: 配置 Rust stable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: 安装构建 CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          npm install --global pnpm@11.12.0 @fission-ai/openspec@1.11.0
          pnpm --dir self-analyst-desktop install --frozen-lockfile

      - name: 运行发布前质量门禁
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          openspec validate --all --strict
          mvn --batch-mode test
          cargo test --manifest-path self-analyst-desktop/src-tauri/Cargo.toml
          cargo clippy --manifest-path self-analyst-desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path self-analyst-axsidecar/Cargo.toml
          cargo clippy --manifest-path self-analyst-axsidecar/Cargo.toml --all-targets -- -D warnings

      - name: 运行非敏感 Windows UIA 冒烟
        shell: pwsh
        run: |
          ./scripts/build-axsidecar.ps1
          mvn --batch-mode -pl self-analyst-content -am `
            '-Dselfanalyst.synthetic.uia=true' `
            '-Dtest=SyntheticUiaSmokeTest' `
            '-Dsurefire.failIfNoSpecifiedTests=false' test

      - name: 构建并验证便携包
        shell: pwsh
        run: |
          ./scripts/build-portable.ps1
          ./scripts/check-packaged-jar.ps1 `
            -JarPath dist-portable/self-analyst-app.jar `
            -JavaPath dist-portable/runtime/bin/java.exe

      - name: 构建并验证 NSIS 安装包
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -SkipBuild -SkipInstall
          ./scripts/check-installer.ps1

      - name: 上传分发产物
        uses: actions/upload-artifact@v7
        with:
          name: SelfAnalyst-Windows-${{ github.ref_name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @(
            '## 分发包',
            '',
            '本 Release 由 Windows 发布工作流构建并校验。',
            '',
            '- 便携 ZIP：免安装，数据目录在可执行文件旁边',
            '- NSIS 安装包：用户数据在当前用户应用数据目录，不随应用文件升级或卸载',
            '- 对应 `.sha256`：校验和',
            '',
            '发布包不包含 PaddleOCR、Tesseract、Whisper 或语音模型。当前完整桌面体验面向 Windows 10/11。'
          ) -join "`n" | Set-Content -LiteralPath $notes -Encoding utf8NoBOM
          $files = @(Get-ChildItem -LiteralPath artifacts -File)
          if ($files.Count -eq 0) { throw "artifacts/ 中没有可发布文件" }
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag --json tagName 2>$null | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $PSNativeCommandUseErrorActionPreference = $true
          if ($exists) {
            gh release upload $tag --clobber -- $files.FullName
          } else {
            gh release create $tag --title $tag --notes-file $notes --generate-notes --verify-tag -- $files.FullName
          }
