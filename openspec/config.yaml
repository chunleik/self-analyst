schema: spec-driven

context: |
  SelfAnalyst 是使用 Java 21 的 Maven 多模块、本地优先个人活动分析项目。
  桌面壳使用 Tauri，Windows accessibility sidecar 使用 Rust；Node.js 仅用于桌面 UI 测试和构建。
  项目文档统一使用简体中文，命令、代码标识符、文件路径和专有名词可以保留英文。

  现行行为契约以 openspec/specs/ 下的主规格为准，架构边界位于 docs/architecture.md。
  docs/specs/ 保留为迁移来源和历史追溯，不再作为与 OpenSpec 并行维护的第二套权威规格。
  创建或修改能力时必须先读取对应 OpenSpec 主规格；既有 SPEC-<域>-* ID 是稳定追溯标识，
  不得改号或复用。

  内容采集只持久化标题事实，不保存 UIA 正文、控件树、截图、OCR 或音频。文件采集严格限于
  用户显式配置目录内的文件系统元数据；除安全解析 .gitignore 外，不读取普通文件正文，不计算
  内容哈希，不生成摘要、主题或 embedding，也不向 LLM、MCP、搜索或其他进程外发正文。

  保留工作区中与当前任务无关的修改。行为契约变化时，应同步更新相关规格和用户可见文档。

rules:
  proposal:
    - 使用简体中文说明 Why、What、Capabilities 和 Impact
    - 明确区分新行为、行为修改与仅迁移既有文档的基线变更
    - 基线迁移不得把旧文档中的候选设计、历史方案或已移除行为描述成当前能力
  specs:
    - 使用简体中文编写可观察、可验证的行为契约，并使用 SHALL 或 MUST 表达规范性要求
    - 每条 Requirement 至少包含一个严格使用四级标题的 Scenario，并明确 WHEN 和 THEN
    - Requirement 名称应保留或分配稳定的 SPEC-<域>-* ID
    - 不写入私有类或方法清单、依赖版本、逐步实现方案、源码追溯矩阵或已完成实施记录
    - 基线内容必须与当前代码和测试核对；发现冲突时先显式记录并解决，不得静默选择
  design:
    - 仅在存在需要解释的技术决策、跨模块边界、迁移风险或重要取舍时创建
    - 纯文档基线转换且不改变系统设计时不创建 design.md
  tasks:
    - 每项任务必须可检查，并写明文件、验证命令或完成证据
    - 纯文档基线迁移不得生成业务代码实现任务
    - 先运行针对性验证；涉及跨模块行为时再运行完整测试

operations:
  apply:
    guidance:
      - 保留无关工作区修改，只处理已批准 change 的任务
      - 缺陷修复应补充回归测试，先运行针对性测试再按风险扩大验证范围
      - 行为契约变化时同步更新对应 OpenSpec 主规格；用户向或架构文档需要时一并更新
  archive:
    guidance:
      - 归档前确认任务完成、严格验证通过，并说明主规格是否已经同步
      - 明确列出仍保留在 docs/ 下的历史或用户向文档及其后续处理
