# Log output directory (used by run.ps1 to write logs/run.log)
log.dir=./logs

# ── 应用语言 / Application language — 见 openspec/specs/internationalization/spec.md ──
# zh = 中文；en = English；auto = 按系统 Locale 自动判定（默认）
# 影响后端发给 LLM 的提示词与桌面 UI 文案；改后需重启后端使提示词生效，UI 刷新即更新
app.language=auto

# LLM configuration
llm.api-key=${OPENAI_API_KEY:CHANGE_ME}
llm.base-url=https://api.openai.com/v1
llm.model=gpt-4o
# 单次 LLM 输出 token 上限（0 = 不限，交给服务端默认）
llm.max-tokens=2048
# Agent 单次对话最大推理/工具调用轮数（每轮一次 LLM 调用，是 token 消耗的主要放大点）
llm.agent.maxIters=8

# ── AgentState 上下文压缩（需重启）──
agent.compaction.enabled=true
agent.compaction.triggerMessages=30
agent.compaction.triggerTokens=60000
agent.compaction.keepMessages=10
agent.compaction.keepTokens=12000

# ── Token 用量限制 / 每日预算 — 见 openspec/specs/llm-budget/spec.md ──
# off = 不限制；warn = 仅记录用量并在接近上限时告警；block = 达上限后拦截后续 LLM 调用
llm.budget.mode=warn
# 每日总 token 上限（input+output 合计，跨 Agent/摘要/embedding；0 = 不限）
llm.budget.dailyTokens=100000000
# 达到上限的该比例时触发 WARN（0~1）
llm.budget.warnRatio=0.8
# summary 页最多对前 N 条 timeline 做 LLM 增强，其余仅本地汇总，封顶单次打开页面的调用数
desktop.summary.maxTimelineLlm=4

# ActivityWatch
aw.base-url=http://localhost:5700/api/0
aw.timeout=15000

# Embedded AW mode (embedded | external)
# embedded = use Java AW; external = connect to Python/Rust AW
aw.mode=embedded
aw.port=5700
# Context-title recognition inspects UIA text transiently and persists titles only.
# Data dir — embedded AW stores buckets and events in one aw.db file
# 默认用户目录: ${user.home}/.self-analyst/aw-data
aw.data-dir=./data/aw-data
# 永久原始事件层固定启用；不提供 TTL、容量上限或自动删除配置
aw.raw.dir=./data/aw-data/raw
aw.raw.query.maxRangeDays=31
aw.raw.query.maxPageSize=1000
# 原始目录可用空间阈值：10 GiB 告警，1 GiB 阻止新采集
aw.raw.lowDisk.warnBytes=10737418240
aw.raw.lowDisk.blockBytes=1073741824
# latest = 仅校验最新分区；all = 校验全部分区
aw.raw.integrity.verifyOnStartup=latest
aw.raw.projector.batchSize=1000
# Memory
# 默认用户目录: ${user.home}/.self-analyst
memory.dir=./data/memory

# LLM Wiki multi-level time summaries
# 隐私默认：关闭。会把活动内容发送给 LLM 生成多级时间摘要，按需在配置中开启。
wiki.enabled=false
# 启动时回填全部历史时段会逐条调用 LLM 摘要，形成启动尖峰；默认关闭，按需手动开启
wiki.backfill.enabled=false
wiki.worker.intervalSeconds=60
wiki.prompt.maxContentChars=12000
wiki.topApps.limit=10
# Semantic index (Lucene vector search)
wiki.semantic.enabled=true
wiki.semantic.topK=8

# Embedding (OpenAI-compatible)
# 隐私默认：关闭。会把文本发送给 embedding 服务做向量化（语义检索依赖它）；按需开启。
embedding.enabled=false
embedding.base-url=https://api.openai.com/v1
embedding.api-key=${EMBEDDING_API_KEY:}
embedding.model=text-embedding-3-small
embedding.dimensions=1024
embedding.send-encoding-format=true

# File Watch — see openspec/specs/file-metadata-collection/spec.md
# 严格隐私边界：只采集文件名、路径、大小、创建时间和修改时间；不读取文件正文。
file.watch.enabled=false
# 逗号分隔的绝对路径，可监控多个目录；为空时即使 enabled=true 也不会启动
file.watch.paths=
file.watch.maxFileSizeKb=0
file.watch.worker.intervalSeconds=60
# 文件连续静默≥此值才入队（去抖），避免元数据抖动 / heartbeat 洪泛
file.watch.debounceSeconds=5
# 同一文件 heartbeat 最小发送间隔（秒）
file.watch.heartbeatThrottleSeconds=5
# 默认只采集 Office + Markdown；空=不采集，*=显式允许全部类型
file.watch.extensions=doc,docx,docm,xls,xlsx,xlsm,xlsb,ppt,pptx,pptm,pps,ppsx,ppsm,pot,potx,potm,md,markdown
file.watch.excludeDirs=
file.watch.excludeGlobs=
file.watch.respectGitIgnore=true

# Web search via MCP (Parallel Search) — see openspec/specs/web-search/spec.md
# 隐私默认：关闭。会把查询发送给外部搜索服务（Parallel Search）；按需开启并配置 api-key。
websearch.enabled=false
# Streamable-HTTP MCP endpoint
websearch.mcp-url=https://search.parallel.ai/mcp
# Required for the search provider; empty disables actual searches even if enabled.
# Leave empty here and set the WEBSEARCH_API_KEY env var (or override in user config).
websearch.api-key=
