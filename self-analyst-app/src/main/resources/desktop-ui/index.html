<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SelfAnalyst</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ======== TOP NAVIGATION ======== -->
<header id="top-nav">
  <div class="nav-left">
    <span class="brand">SelfAnalyst</span>
    <nav class="tabs">
      <button class="tab active" data-tab="agent" data-i18n="tab.agent">Agent</button>
      <button class="tab" data-tab="chat" data-i18n="tab.chat">会话</button>
      <button class="tab hidden" data-tab="files" data-i18n="tab.files">文件</button>
    </nav>
  </div>
  <div class="nav-right status-bar" id="status-bar">
    <span class="status-dot" id="backend-dot"></span>
    <span id="backend-text" data-i18n="status.service">服务</span>
    <span class="status-dot" id="collectors-dot"></span>
    <span id="collectors-text" data-i18n="status.capture">采集</span>
    <span class="status-dot" id="raw-dot"></span>
    <span id="raw-text" data-i18n="status.raw">原始事件</span>
    <button id="file-status-btn" class="status-action hidden" type="button" title="文件采集">
      <span class="status-dot" id="file-dot"></span>
      <span id="file-text" data-i18n="status.file">文件</span>
    </button>
    <span class="status-dot" id="llm-dot"></span>
    <span id="llm-text" data-i18n="status.llm">LLM</span>
    <button id="config-open-btn" class="btn btn-icon" title="配置" data-i18n-title="action.settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<!-- ======== MAIN CONTENT ======== -->
<main id="main-content">

  <!-- ===== AGENT TAB ===== -->
  <section id="tab-agent" class="tab-content active">
    <div class="agent-grid">

      <!-- Left Column: Behavior Advice + Timeline -->
      <div class="agent-left">
        <!-- Behavior Advice Card (SPEC-ADV-IA-001, SPEC-ADV-IA-002) -->
        <div id="behavior-advice-card" class="card behavior-advice-card">
          <div class="card-body" id="behavior-advice-body">
            <div class="loading-placeholder" data-i18n="advice.analyzing">分析行为数据中...</div>
          </div>
        </div>

        <!-- Timeline -->
        <div id="timeline" class="card timeline-card">
          <div class="card-header">
            <h2 class="card-title" data-i18n="timeline.title">时间轴</h2>
          </div>
          <div class="card-body" id="timeline-body">
            <div class="loading-placeholder" data-i18n="common.loading">加载中...</div>
          </div>
        </div>
      </div>

      <!-- Right Column: Future Tasks -->
      <div class="agent-right">
        <div id="future-tasks-panel" class="card fixed-card">
          <div class="card-header">
            <h2 class="card-title" data-i18n="tasks.title">未来任务</h2>
          </div>
          <div class="card-body" id="tasks-body">
            <div class="loading-placeholder" data-i18n="common.loading">加载中...</div>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- ===== FILES TAB ===== -->
  <section id="tab-files" class="tab-content">
    <div class="file-page">
      <div class="file-page-header">
        <div>
          <div class="file-title-row">
            <h2 class="file-page-title" data-i18n="file.title">文件采集</h2>
            <div id="file-tab-status"></div>
          </div>
          <p id="file-tab-subtitle" class="file-page-subtitle" data-i18n="file.subtitle">只采集文件名、路径和时间等文件系统元数据</p>
        </div>
        <button id="file-settings-btn" class="btn btn-outline" type="button" data-i18n="file.settings">采集设置</button>
      </div>
      <div id="file-content" class="file-content" aria-live="polite">
        <div class="loading-placeholder" data-i18n="common.loading">加载中...</div>
      </div>
    </div>
  </section>

  <!-- ===== CHAT TAB ===== -->
  <section id="tab-chat" class="tab-content">
    <div class="chat-tab-layout">
      <!-- LEFT: session list sidebar -->
      <aside class="chat-session-sidebar">
        <div class="chat-session-header">
          <h3 class="card-title" data-i18n="chat.sessionsTitle">会话列表</h3>
          <button id="new-chat-session-btn" class="btn btn-sm btn-primary" title="新建会话" data-i18n-title="chat.newSessionTitle" data-i18n="chat.newBtn">+ 新建</button>
        </div>
        <input id="chat-session-search-input" class="chat-session-search" type="text" placeholder="搜索会话..." data-i18n-placeholder="chat.searchPlaceholder">
        <div id="chat-session-list" class="chat-session-list">
          <div class="chat-session-empty" data-i18n="chat.emptyHint">暂无会话，点击"+ 新建"开始</div>
        </div>
      </aside>

      <!-- CENTER: main chat workspace -->
      <section class="chat-workspace">
        <div class="chat-workspace-header">
          <span id="chat-session-title" class="chat-session-title" data-i18n="chat.selectOrCreate">选择或创建会话</span>
        </div>
        <div id="chat-thread" class="chat-thread deep-chat-host">
          <deep-chat id="deep-chat" aria-label="SelfAnalyst chat"></deep-chat>
        </div>
        <div id="chat-fallback" class="chat-fallback hidden">
          <div id="chat-fallback-thread" class="chat-thread">
            <div class="chat-welcome">
              <p data-i18n="chat.welcomeTitle">欢迎使用会话模式</p>
              <p class="chat-welcome-hint" data-i18n="chat.welcomeHint">可以追问当前状态、记录想法、生成待办</p>
            </div>
          </div>
          <div class="chat-composer">
            <textarea id="chat-tab-input" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" data-i18n-placeholder="chat.composerPlaceholder" rows="2" disabled></textarea>
            <button id="chat-tab-send-btn" class="btn btn-primary" disabled data-i18n="chat.send">发送</button>
          </div>
        </div>
      </section>

      <!-- RIGHT: context panel -->
      <aside class="chat-context-panel">
        <div id="chat-context-summary" class="chat-context-section">
          <h4 data-i18n="chat.ctxCurrentStatus">当前状态</h4>
          <div class="chat-context-content" data-i18n="common.noData">暂无数据</div>
        </div>
        <div id="chat-recent-activity" class="chat-context-section">
          <h4 data-i18n="chat.ctxRecentActivity">最近活动</h4>
          <div class="chat-context-content" data-i18n="chat.noActivitySummary">暂无活动摘要</div>
        </div>
        <div id="chat-task-suggestions" class="chat-context-section">
          <h4 data-i18n="chat.ctxTaskSuggestions">可生成待办</h4>
          <div class="chat-context-content" data-i18n="chat.noSuggestedTasks">暂无建议待办</div>
        </div>
        <div id="chat-memory-section" class="chat-context-section">
          <h4 data-i18n="memory.chatTitle">长期记忆</h4>
          <div class="chat-context-content" id="chat-memory-content" data-i18n="memory.loading">加载中...</div>
        </div>
        <div id="chat-context-toggles" class="chat-context-section">
          <h4 data-i18n="chat.ctxContext">上下文</h4>
          <label class="chat-context-toggle"><input type="checkbox" data-toggle="currentStatus" checked> <span data-i18n="chat.ctxCurrentStatus">当前状态</span></label>
          <label class="chat-context-toggle"><input type="checkbox" data-toggle="futureTasks" checked> <span data-i18n="chat.ctxFutureTasks">未来任务</span></label>
        </div>
      </aside>
    </div>
  </section>

</main>

<!-- ======== FILE COLLECTION SETTINGS ======== -->
<div id="file-settings-modal" class="config-modal file-settings-modal hidden" role="dialog" aria-modal="true" aria-labelledby="file-settings-title">
  <div class="config-modal-overlay"></div>
  <div class="config-modal-panel">
    <div class="config-modal-header">
      <div>
        <h3 id="file-settings-title" data-i18n="file.settingsTitle">文件采集设置</h3>
        <p class="file-settings-subtitle" data-i18n="file.settingsSubtitle">只管理采集开关，保存后立即生效</p>
      </div>
      <button id="file-settings-close-btn" class="btn btn-icon" type="button" title="关闭" data-i18n-title="action.close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="file-settings-body">
      <label class="file-settings-toggle">
        <span><strong data-i18n="file.enableCollection">启用文件采集</strong><small data-i18n="file.enableCollectionHint">关闭后保留目录配置，但暂停监控和元数据采集。</small></span>
        <input id="file-settings-enabled" type="checkbox">
      </label>
      <div id="file-settings-error" class="file-settings-error hidden" role="alert"></div>
    </div>
    <div class="file-settings-actions">
      <span data-i18n="file.liveApplyNote">保存后无需重启，开关会立即生效。</span>
      <div>
        <button id="file-settings-cancel-btn" class="btn btn-outline" type="button" data-i18n="action.cancel">取消</button>
        <button id="file-settings-save-btn" class="btn btn-primary" type="button" data-i18n="action.save">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- ======== CONFIG MODAL ======== -->
<div id="config-modal" class="config-modal hidden">
  <div class="config-modal-overlay"></div>
  <div class="config-modal-panel">
    <div class="config-modal-header">
      <h3 data-i18n="config.modalTitle">配置</h3>
      <button id="config-close-btn" class="btn btn-icon" title="关闭" data-i18n-title="action.close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="config-modal-body">
      <div class="config-grid" id="config-grid">
        <div class="loading-placeholder" style="grid-column:1/-1;text-align:center;padding:60px 0;" data-i18n="config.loading">加载配置中...</div>
      </div>
    </div>
  </div>
</div>

<!-- ======== CHAT DRAWER ======== -->
<div id="chat-drawer" class="chat-drawer hidden">
  <div class="chat-overlay"></div>
  <div class="chat-panel">
    <div class="chat-header">
      <h3 id="chat-title" data-i18n="drawer.discuss">讨论</h3>
      <button id="chat-close-btn" class="btn btn-icon" title="关闭" data-i18n-title="action.close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="chat-context" id="chat-context"></div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-suggestions" id="chat-suggestions"></div>
    <div class="chat-input-area">
      <textarea id="chat-input" placeholder="输入消息..." data-i18n-placeholder="drawer.inputPlaceholder" rows="2"></textarea>
      <button id="chat-send-btn" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- ======== GLOBAL OVERLAYS ======== -->
<div id="error-overlay" class="overlay hidden">
  <div class="overlay-content">
    <div class="overlay-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div>
    <p id="error-message" data-i18n="error.notReady">本地服务未就绪，正在重试...</p>
    <button id="error-retry-btn" class="btn btn-primary" data-i18n="error.retry">重试连接</button>
  </div>
</div>

<script type="module" src="deep-chat.bundle.js"></script>
<script src="utils.js"></script>
<script src="i18n.js"></script>
<script src="state.js"></script>
<script src="api.js"></script>
<script src="agent.js"></script>
<script src="deep-chat-adapter.js"></script>
<script src="chat.js"></script>
<script src="chat-drawer.js"></script>
<script src="config.js"></script>
<script src="files.js"></script>
<script src="ui.js"></script>
<script src="events.js"></script>
<script src="init.js"></script>
</body>
</html>
