[package]
name = "self-analyst-axsidecar"
version = "1.0.0"
edition = "2021"
description = "OS-neutral accessibility-tree sidecar for SelfAnalyst (SPEC-AXS-*)"

[[bin]]
name = "axsidecar"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
