[package]
name = "self-analyst-axsidecar"
version = "0.1.0"
edition = "2021"
description = "OS-neutral accessibility-tree sidecar for SelfAnalyst (SPEC-AXS-*)"

[[bin]]
name = "axsidecar"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25"

[profile.release]
opt-level = "z"
lto = true
strip = true
